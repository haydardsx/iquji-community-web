name: Community Web npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      verify_tag:
        description: Released tag to verify
        type: string

permissions:
  contents: read

concurrency:
  group: community-web-npm
  cancel-in-progress: false

jobs:
  verify-registry:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.verify_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 核对已发布标签与公开制品
        env:
          RELEASE_TAG: ${{ inputs.verify_tag }}
          COMMUNITY_RELEASE_EMAIL: community@iqu.lol
        run: |
          set -eu
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" HEAD
          git diff --exit-code "$RELEASE_TAG" HEAD -- component editor i18n icons motion network query terminal theme >/dev/null
          bun run check >/dev/null 2>&1
          node scripts/release.mjs --verify-published >/dev/null 2>&1

  verify-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      registration: ${{ steps.archives.outputs.registration }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 核对版本标签和主线检查
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          test "$GITHUB_REF_TYPE" = tag
          node scripts/release-tag.mjs "$GITHUB_REF_NAME"
          commit=$(git rev-parse HEAD)
          count=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$commit&per_page=100" --jq ".workflow_runs[] | select(.head_sha == \"$commit\" and .head_branch == \"main\" and .conclusion == \"success\") | .id" | wc -l)
          test "$count" -gt 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 检查公开源码、公开包和预览
        run: |
          if ! bun run check >/dev/null 2>&1; then
            echo "::error::Package or preview checks failed."
            exit 1
          fi
      - name: 准备首次注册制品
        id: archives
        run: node scripts/initial-registration.mjs prepare "$RUNNER_TEMP/registration"
      - uses: actions/upload-artifact@v4
        if: steps.archives.outputs.registration == 'true'
        with:
          name: initial-registration
          path: ${{ runner.temp }}/registration/*.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: package-build
          if-no-files-found: error
          retention-days: 1
          path: |
            component/dist/
            editor/dist/
            i18n/dist/
            icons/dist/
            motion/dist/
            network/dist/
            query/dist/
            terminal/dist/
            theme/dist/

  publish:
    if: needs.verify-tag.outputs.registration == 'false'
    needs: verify-tag
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: package-build
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 使用支持可信发布的 npm
        run: npm install --global npm@11
      - name: 发布并校验固定版本
        env:
          COMMUNITY_RELEASE_EMAIL: ${{ secrets.COMMUNITY_RELEASE_EMAIL }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            result=0
            node scripts/release.mjs >/dev/null 2>&1 || result=$?
            if [ "$result" -eq 0 ]; then exit 0; fi
            if [ "$result" -ne 75 ] || [ "$attempt" -eq 3 ]; then exit "$result"; fi
            sleep 30
          done
