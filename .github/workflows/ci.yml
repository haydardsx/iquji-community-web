name: Community Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: community-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 核对提交和拉取请求标题
        run: python3 .github/scripts/check_subjects.py
      - name: 核对源码与提交元数据
        env:
          CANDIDATE: ${{ github.event.pull_request.head.sha || github.event.merge_group.base_sha || github.sha }}
        run: python3 .github/scripts/community_guard.py --repo . --tree "$CANDIDATE" --history
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 检查公开包、预览与制品内容
        run: |
          if ! bun run check >/dev/null 2>&1; then
            echo "::error::Package or preview checks failed."
            exit 1
          fi
